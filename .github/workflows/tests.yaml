name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  home-assistant:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.13"
            ha: "2025.1.4"
            frontend: "20250109.2"
            plugin: "0.13.205"
          - python: "3.14"
            ha: "2026.7.4"
            frontend: "20260624.6"
            plugin: "0.13.348"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: >-
          python -m pip install --pre
          homeassistant==${{ matrix.ha }}
          home-assistant-frontend==${{ matrix.frontend }}
          pytest-homeassistant-custom-component==${{ matrix.plugin }}
          pytest-aiohttp ruff
      - if: matrix.ha == '2025.1.4'
        run: python -m pip install pycares==4.5.0
      - run: ruff check .
      - run: python -m compileall -q custom_components tests
      - run: pytest
      - run: python scripts/build_release.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test

  bridge-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: docker build -f Dockerfile.bridge -t hackrf-bridge:test .
      - name: Check CLI without opening USB
        run: docker run --rm hackrf-bridge:test python -m custom_components.hackrf_radio.bridge --help

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: home-assistant/actions/hassfest@master
